<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Experience & Career Timeline — Nguyen Le Hai | Business Analyst</title>
  <meta name="description"
    content="Career timeline and work history of Nguyen Le Hai — Business Analyst with 4+ years of experience across Outsourcing and Product environments in MarTech, Hospitality, and AI Security." />
  <link rel="icon" type="image/svg+xml" href="public/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,300;0,14..32,400;0,14..32,500;0,14..32,600;0,14..32,700;1,14..32,300&family=Outfit:wght@300;400;600;700;800&display=swap"
    rel="stylesheet" />
  <style>
    /* ─── Reset & Design System ────────────────────────────── */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --cream: #1A1A1A;
      --black: #FAF8F4;
      --gray-900: #F2EFE9;
      --gray-800: #E8E3DA;
      --gray-700: #D0C9BC;
      --gray-500: #7A7060;
      --gray-400: #9A9080;
      --gray-300: #3D3830;
      --accent: #8B6B3D;
      --accent-dim: rgba(139, 107, 61, 0.12);
      --accent-glow: rgba(139, 107, 61, 0.07);
      --glass: rgba(0, 0, 0, 0.03);
      --glass-border: rgba(0, 0, 0, 0.09);
      --radius: 4px;
      --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    html {
      scroll-behavior: smooth;
      font-size: 16px;
    }

    body {
      background: var(--black);
      color: var(--cream);
      font-family: 'Inter', sans-serif;
      font-weight: 400;
      line-height: 1.6;
      overflow-x: hidden;
    }

    ::selection {
      background: var(--accent);
      color: #FAF8F4;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font-family: inherit;
      cursor: pointer;
      border: none;
      background: none;
    }

    /* ─── Typography & Layout ───────────────────────────────── */
    .font-display {
      font-family: 'Outfit', sans-serif;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 2rem;
    }

    @media (max-width: 768px) {
      .container {
        padding: 0 1.25rem;
      }
    }

    /* ─── Navbar ─────────────────────────────────────────────── */
    #navbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      padding: 1.25rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--glass-border);
      background: rgba(250, 248, 244, 0.92);
      backdrop-filter: blur(20px);
      transition: all var(--transition);
    }

    .nav-brand {
      font-family: 'Outfit', sans-serif;
      font-weight: 700;
      font-size: 1.1rem;
      letter-spacing: 0.05em;
      color: var(--cream);
    }

    .nav-brand span {
      color: var(--accent);
    }

    .nav-links {
      display: flex;
      gap: 2rem;
      align-items: center;
    }

    .nav-links a {
      font-size: 0.78rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--gray-500);
      transition: color var(--transition);
      position: relative;
    }

    .nav-links a::after {
      content: '';
      position: absolute;
      bottom: -3px;
      left: 0;
      right: 0;
      height: 1px;
      background: var(--accent);
      transform: scaleX(0);
      transition: transform var(--transition);
    }

    .nav-links a:hover,
    .nav-links a.active {
      color: var(--cream);
      font-weight: 600;
    }

    .nav-links a:hover::after,
    .nav-links a.active::after {
      transform: scaleX(1);
    }

    .nav-controls {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    #lang-toggle {
      font-size: 0.7rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--gray-500);
      padding: 0.3rem 0.7rem;
      border: 1px solid var(--gray-700);
      border-radius: var(--radius);
      transition: all var(--transition);
    }

    #lang-toggle:hover {
      color: var(--accent);
      border-color: var(--accent);
    }

    .nav-hamburger {
      display: none;
      flex-direction: column;
      gap: 5px;
    }

    .nav-hamburger span {
      width: 22px;
      height: 1.5px;
      background: var(--cream);
      display: block;
    }

    @media (max-width: 768px) {
      .nav-links {
        display: none;
      }

      .nav-hamburger {
        display: flex;
      }
    }

    /* Mobile Menu */
    #mobile-menu {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 99;
      background: #FAF8F4;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2.5rem;
    }

    #mobile-menu.open {
      display: flex;
    }

    #mobile-menu a {
      font-family: 'Outfit', sans-serif;
      font-size: 2rem;
      font-weight: 600;
      color: #1A1A1A;
      letter-spacing: 0.05em;
    }

    #mobile-menu a.active {
      color: var(--accent);
    }

    #mobile-close {
      position: absolute;
      top: 1.5rem;
      right: 2rem;
      font-size: 1.5rem;
      color: var(--gray-500);
    }

    #mobile-lang {
      font-size: 0.8rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--accent);
      padding: 0.4rem 1rem;
      border: 1px solid var(--accent);
      border-radius: var(--radius);
    }

    /* ─── Page Header ────────────────────────────────────────── */
    .page-header {
      padding: 8rem 0 3rem;
      background: linear-gradient(180deg, #FAF8F4 0%, #F5F0E6 100%);
      border-bottom: 1px solid var(--gray-800);
    }

    .section-label {
      font-size: 0.68rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 0.75rem;
      font-weight: 600;
    }

    .page-title {
      font-family: 'Outfit', sans-serif;
      font-size: clamp(2rem, 4vw, 3rem);
      font-weight: 700;
      color: #1A1A1A;
      line-height: 1.2;
      margin-bottom: 1rem;
    }

    .page-subtitle {
      font-size: 1rem;
      color: var(--gray-500);
      max-width: 680px;
      line-height: 1.6;
    }

    /* ─── Timeline Section ───────────────────────────────────── */
    .exp-section {
      padding: 4rem 0 6rem;
    }

    .exp-grid {
      display: grid;
      grid-template-columns: 7fr 4fr;
      gap: 4rem;
    }

    @media (max-width: 1024px) {
      .exp-grid {
        grid-template-columns: 1fr;
        gap: 3rem;
      }
    }

    .timeline {
      position: relative;
      padding-left: 2rem;
    }

    .timeline::before {
      content: '';
      position: absolute;
      left: 6px;
      top: 16px;
      bottom: 16px;
      width: 2px;
      background: linear-gradient(to bottom, var(--accent), var(--gray-700));
    }

    .timeline-card {
      position: relative;
      background: #FFFFFF;
      border: 1px solid var(--gray-800);
      border-radius: 12px;
      padding: 1.75rem;
      margin-bottom: 2.25rem;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
      transition: transform var(--transition), box-shadow var(--transition), border-color var(--transition);
    }

    .timeline-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.08);
      border-color: rgba(139, 107, 61, 0.35);
    }

    .timeline-card-dot {
      position: absolute;
      left: -2rem;
      top: 1.8rem;
      width: 14px;
      height: 14px;
      background: #FAF8F4;
      border: 3px solid var(--accent);
      border-radius: 50%;
      transform: translateX(-50%);
      box-shadow: 0 0 0 4px rgba(139, 107, 61, 0.15);
      transition: all var(--transition);
    }

    .timeline-card:hover .timeline-card-dot {
      background: var(--accent);
      box-shadow: 0 0 0 6px rgba(139, 107, 61, 0.25);
    }

    .timeline-card-header {
      display: flex;
      align-items: flex-start;
      gap: 1.25rem;
      margin-bottom: 1.25rem;
      flex-wrap: wrap;
    }

    .timeline-company-logo {
      width: 56px;
      height: 56px;
      border-radius: 12px;
      overflow: hidden;
      flex-shrink: 0;
      background: #FAF8F4;
      border: 1px solid var(--gray-800);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
    }

    .timeline-company-logo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .timeline-company-info {
      flex: 1;
      min-width: 220px;
    }

    .timeline-company-name {
      font-family: 'Outfit', sans-serif;
      font-size: 1.15rem;
      font-weight: 700;
      color: #1A1A1A;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      flex-wrap: wrap;
    }

    .timeline-type-badge {
      font-size: 0.68rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 0.2rem 0.6rem;
      border-radius: 4px;
      background: var(--accent-dim);
      color: var(--accent);
    }

    .timeline-period-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      color: var(--gray-500);
      margin-top: 0.25rem;
    }

    .timeline-period-badge.ongoing {
      color: #16a34a;
    }

    .timeline-period-badge.ongoing .dot-live {
      width: 6px;
      height: 6px;
      background: #16a34a;
      border-radius: 50%;
      box-shadow: 0 0 0 3px rgba(22, 163, 74, 0.2);
      animation: pulseGreen 2s infinite;
    }

    @keyframes pulseGreen {
      0% {
        transform: scale(1);
        opacity: 1;
      }

      50% {
        transform: scale(1.4);
        opacity: 0.6;
      }

      100% {
        transform: scale(1);
        opacity: 1;
      }
    }

    .timeline-role-title {
      font-family: 'Outfit', sans-serif;
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--accent);
      margin-bottom: 0.75rem;
    }

    .timeline-metrics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 0.6rem;
      margin-bottom: 1.25rem;
    }

    .timeline-metric-card {
      background: #FAF8F4;
      border: 1px solid var(--gray-800);
      border-radius: 6px;
      padding: 0.6rem 0.8rem;
      display: flex;
      flex-direction: column;
    }

    .timeline-metric-val {
      font-family: 'Outfit', sans-serif;
      font-size: 1.05rem;
      font-weight: 700;
      color: #1A1A1A;
      line-height: 1.2;
    }

    .timeline-metric-lbl {
      font-size: 0.65rem;
      color: var(--gray-500);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-top: 0.15rem;
    }

    .timeline-bullets {
      list-style: none;
      margin-bottom: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
    }

    .timeline-bullets li {
      font-size: 0.86rem;
      color: #3D3830;
      padding-left: 1.2rem;
      position: relative;
      line-height: 1.6;
    }

    .timeline-bullets li::before {
      content: '✦';
      position: absolute;
      left: 0;
      color: var(--accent);
      font-size: 0.7rem;
      top: 2px;
    }

    .timeline-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin-bottom: 1.25rem;
    }

    .timeline-tag-pill {
      font-size: 0.7rem;
      padding: 0.2rem 0.65rem;
      border-radius: 4px;
      background: rgba(0, 0, 0, 0.04);
      color: var(--gray-500);
      border: 1px solid rgba(0, 0, 0, 0.06);
    }

    .timeline-case-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #FAF8F4;
      background: #1A1A1A;
      padding: 0.65rem 1.25rem;
      border-radius: 6px;
      border: 1px solid #1A1A1A;
      transition: all var(--transition);
      cursor: pointer;
    }

    .timeline-case-btn:hover {
      background: var(--accent);
      border-color: var(--accent);
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(139, 107, 61, 0.25);
    }

    .edu-block {
      margin-bottom: 1.75rem;
      background: #FFFFFF;
      padding: 1.25rem;
      border-radius: 8px;
      border: 1px solid var(--gray-800);
    }

    .edu-inst {
      font-family: 'Outfit', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      color: #1A1A1A;
    }

    .edu-degree {
      font-size: 0.85rem;
      color: var(--gray-300);
      margin: 0.25rem 0;
    }

    .edu-period {
      font-size: 0.72rem;
      color: var(--accent);
      letter-spacing: 0.1em;
      font-weight: 600;
    }

    .edu-detail {
      font-size: 0.78rem;
      color: var(--gray-500);
      margin-top: 0.3rem;
      font-style: italic;
    }

    .cert-item {
      padding: 0.85rem 1.25rem;
      background: #FFFFFF;
      border: 1px solid var(--gray-800);
      border-radius: 8px;
      margin-bottom: 0.75rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .cert-name {
      font-size: 0.88rem;
      font-weight: 600;
      color: #1A1A1A;
    }

    .cert-issuer {
      font-size: 0.75rem;
      color: var(--gray-500);
      margin-top: 0.15rem;
    }

    .cert-period {
      font-size: 0.7rem;
      color: var(--accent);
      font-weight: 600;
    }

    /* ─── Modal Styles ────────────────────────────────────────── */
    #modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 200;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(8px);
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    #modal-overlay.open {
      display: flex;
    }

    .modal-box {
      background: #FFFFFF;
      border-radius: 12px;
      max-width: 780px;
      width: 100%;
      max-height: 88vh;
      overflow-y: auto;
      padding: 2.25rem;
      border: 1px solid var(--gray-800);
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.25);
      position: relative;
      animation: modalFade 0.3s ease;
    }

    @keyframes modalFade {
      from {
        opacity: 0;
        transform: scale(0.96);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 1.5rem;
      border-bottom: 1px solid var(--gray-800);
      padding-bottom: 1.25rem;
    }

    .modal-project-meta {
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--accent);
      font-weight: 600;
    }

    .modal-close {
      font-size: 0.8rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--gray-500);
      padding: 0.35rem 0.8rem;
      border: 1px solid var(--gray-700);
      border-radius: 4px;
      cursor: pointer;
      transition: all var(--transition);
    }

    .modal-close:hover {
      color: #1A1A1A;
      border-color: #1A1A1A;
    }

    .modal-section-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: var(--accent);
      font-weight: 700;
      margin-top: 1.5rem;
      margin-bottom: 0.5rem;
    }

    .modal-text {
      font-size: 0.9rem;
      color: var(--gray-300);
      line-height: 1.75;
    }

    .modal-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
    }

    .modal-list li {
      font-size: 0.88rem;
      color: #3D3830;
      padding-left: 1.25rem;
      position: relative;
      line-height: 1.6;
    }

    .modal-list li::before {
      content: '→';
      position: absolute;
      left: 0;
      color: var(--accent);
      font-size: 0.8rem;
    }

    /* Footer */
    footer {
      padding: 2.5rem 0;
      text-align: center;
      border-top: 1px solid var(--glass-border);
      background: var(--black);
    }

    footer p {
      font-size: 0.75rem;
      color: var(--gray-500);
      letter-spacing: 0.08em;
    }
  </style>
</head>

            <div class="edu-degree">${e.degree}</div>
            <div class="edu-period">${e.period}</div>
            ${e.detail ? `<div class="edu-detail">${e.detail}</div>` : ''}
          </div>`).join('')}
        <div style="margin-top:2rem">
          ${d.certifications.map(c => `
            <div class="cert-item">
              <div>
                <div class="cert-name">${c.name}</div>
                <div class="cert-issuer">${c.issuer}</div>
              </div>
              <div class="cert-period">${c.period}</div>
            </div>`).join('')}
        </div>`;

      // Footer
      document.getElementById('footer-text').innerHTML = `Nguyen Le Hai — Business Analyst Portfolio &copy; ${new Date().getFullYear()}`;
    }

    // Modal logic
    function openModal(id) {
      const d = DATA[currentLang];
      const p = d.projects.items.find(item => item.id === id);
      if (!p) return;

      document.getElementById('modal-meta').textContent = `${p.company} • ${p.domain}`;
      document.getElementById('modal-title').textContent = p.title;
      document.getElementById('modal-close-btn').textContent = d.projects.modalClose;

      document.getElementById('modal-body').innerHTML = `
        <div class="modal-section-label">${currentLang === 'vi' ? 'Bối cảnh dự án' : 'Context & Problem Statement'}</div>
        <p class="modal-text">${p.context}</p>

        <div class="modal-section-label">${currentLang === 'vi' ? 'Vai trò & Cách tiếp cận' : 'My Role & Approach'}</div>
        <p class="modal-text">${p.roleApproach}</p>

        <div class="modal-section-label">${currentLang === 'vi' ? 'Công việc cụ thể đã thực hiện (Key Deliverables)' : 'What I Did (Key Deliverables)'}</div>
        <ul class="modal-list">
          ${p.whatIDid.map(item => `<li>${item}</li>`).join('')}
        </ul>

        <div class="modal-section-label">${currentLang === 'vi' ? 'Kết quả & Tác động số liệu (Impact & Metrics)' : 'Impact & Metrics'}</div>
        <ul class="modal-list">
          ${p.impact.map(item => `<li>${item}</li>`).join('')}
        </ul>
      `;

      document.getElementById('modal-overlay').classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function closeModal() {
      document.getElementById('modal-overlay').classList.remove('open');
      document.body.style.overflow = '';
    }

    document.getElementById('modal-overlay').addEventListener('click', e => {
      if (e.target === document.getElementById('modal-overlay')) closeModal();
    });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

    function toggleLang() {
      currentLang = currentLang === 'en' ? 'vi' : 'en';
      localStorage.setItem('portfolio-lang', currentLang);
      render();
    }

    document.getElementById('lang-toggle').addEventListener('click', toggleLang);
    document.getElementById('mobile-lang').addEventListener('click', () => { toggleLang(); closeMobileMenu(); });

    // Mobile menu
    function openMobileMenu() { document.getElementById('mobile-menu').classList.add('open'); document.body.style.overflow = 'hidden'; }
    function closeMobileMenu() { document.getElementById('mobile-menu').classList.remove('open'); document.body.style.overflow = ''; }
    document.getElementById('hamburger').addEventListener('click', openMobileMenu);
    document.getElementById('mobile-close').addEventListener('click', closeMobileMenu);

    document.getElementById('year').textContent = new Date().getFullYear();
    render();
  </script>
</body>

</html>
